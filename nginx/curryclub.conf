server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /home/ubuntu/CurryClub/dist;

    # Serve index.html as the default file
    index index.html;

    server_name curryclub.lol www.curryclub.lol;

    # Allow Let's Encrypt HTTP-01 challenge (required for certbot renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        # Try static file, then directory, then SPA fallback via named location.
        # The named @spa location avoids nginx's internal redirect limit (which
        # would otherwise cause a 500 error if dist/index.html is missing).
        try_files $uri $uri/ @spa;

        # Add cache control headers
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # SPA fallback: serve index.html for client-side routes
    location @spa {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files /index.html =503;
    }

    # Serve uploaded photos directly from the uploads directory
    location /uploads/ {
        alias /home/ubuntu/CurryClub/uploads/;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # Proxy API requests to Node.js backend
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never cache API responses
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
