server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /home/ubuntu/CurryClub/dist;

    # Serve index.html as the default file
    index index.html;

    server_name curryclub.lol www.curryclub.lol;

    # Allow Let's Encrypt HTTP-01 challenge (required for certbot renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        # Try static file, then directory, then fall back to the Node.js SPA handler.
        try_files $uri $uri/ @spa;

        # Add cache control headers
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # SPA fallback: proxy to Node.js backend for client-side routes.
    # Proxying avoids a 503 that would occur if dist/index.html were
    # temporarily absent (e.g. during a build), and lets the Node.js
    # catch-all handler serve index.html reliably.
    location @spa {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Serve uploaded photos directly from the uploads directory
    location /uploads/ {
        alias /home/ubuntu/CurryClub/uploads/;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # Proxy API requests to Node.js backend
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never cache API responses
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
